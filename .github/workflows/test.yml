name: tests

on:
  push:
    branches: [ main ]
  pull_request:

# Serialize runs per ref so production deploys can never land out of order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests (Node built-in runner, no dependencies)
        run: node --test 'tests/**/*.test.js'

  # Keep the admin "Coverage" tab snapshot fresh: regenerate it from the suite
  # and commit the result back to main. GitHub never triggers workflows for
  # GITHUB_TOKEN pushes (its own anti-loop rule), so the bot commit cannot be
  # CI-tested after the fact — instead the regenerated file is validated HERE,
  # before it is committed and deployed.
  coverage-snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deploy_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate the admin coverage snapshot
        run: node scripts/update-coverage.mjs
      - name: Validate the regenerated file before it can deploy
        run: |
          node --check admin/admin.js
          node --test tests/admin-editor.test.js
      - name: Commit the refreshed snapshot if it changed
        run: |
          if ! git diff --quiet -- admin/index.html admin/admin.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add admin/index.html admin/admin.js
            git commit -m "Auto-update admin coverage snapshot"
            git push
          else
            echo "Snapshot already current."
          fi
      - name: Record the exact commit to deploy
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Production deploy is gated on the suite: Vercel's git auto-deploy for main
  # is off (vercel.json git.deploymentEnabled), so the ONLY path to production
  # is this job, which needs test + coverage-snapshot to succeed. Deploys the
  # exact SHA the coverage job left on main (includes any refreshed snapshot).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, coverage-snapshot]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_tWwsaxggw510huVDYZY7dncV
      VERCEL_PROJECT_ID: prj_DySkDGxNVCU0CvLQ4xhTOLKSfUJh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.coverage-snapshot.outputs.deploy_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy to Vercel production
        # Pinned: vercel@59 (17 Aug 2026) fails env-linked CI deploys with
        # "Could not retrieve Project Settings"; 58 was the last green major.
        run: npx vercel@58 deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
