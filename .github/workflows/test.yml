name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests (Node built-in runner, no dependencies)
        run: node --test 'tests/**/*.test.js'

  # Keep the admin "Coverage" tab snapshot fresh: regenerate it from the suite
  # and commit the result back to main. GitHub never triggers workflows for
  # GITHUB_TOKEN pushes (its own anti-loop rule), so the bot commit cannot be
  # CI-tested after the fact — instead the regenerated file is validated HERE,
  # before it is committed and deployed.
  coverage-snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate the admin coverage snapshot
        run: node scripts/update-coverage.mjs
      - name: Validate the regenerated file before it can deploy
        run: |
          node --check admin/admin.js
          node --test tests/admin-editor.test.js
      - name: Commit the refreshed snapshot if it changed
        run: |
          if ! git diff --quiet -- admin/index.html admin/admin.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add admin/index.html admin/admin.js
            git commit -m "Auto-update admin coverage snapshot"
            git push
          else
            echo "Snapshot already current."
          fi
